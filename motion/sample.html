  coffee brand ("Kopi Nalar"), framed by Otak Rental's HUD, that zooms out at the end into a
  portfolio card ("Ini contoh paket 15 detik"). Deterministic: renderAt(t) draws any frame.
  Render: node render.mjs --page sample.html --width 1080 --height 1350 --name otak-rental-sample-15s --sound sample_sound.py
-->

  --cream:#FAF7F0; --ink:#05100E; --lime:#D4E751; --emerald:#17463A; --line:#E6DFD0;

  --latte:#FAF1E4; --espresso:#23150E; --roast:#3A2213; --caramel:#C8792E; --aren:#7A3E17;
  --milk:#EFDCC2; --orange:#E8622C; --foam:#F6E9D7;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#15130F}
body{display:flex;align-items:center;justify-content:center;overflow:hidden}
body.capture{display:block;background:var(--cream)}
#viewport{position:relative;width:1080px;height:1350px;transform-origin:0 0;flex:none}
#stage{position:absolute;inset:0;overflow:hidden;background:var(--cream);color:var(--ink);font-family:"Geist",sans-serif;
  -webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
.layer{position:absolute;inset:0}
.abs{position:absolute;left:0;top:0}
.mono{font-family:"Geist Mono",monospace}
.serif{font-family:"Instrument Serif",serif;font-style:italic;font-weight:400}
.mask{display:inline-block;overflow:hidden;vertical-align:top;padding:.06em .12em .16em;margin:-.06em -.12em -.16em}
.ch,.wd{display:inline-block;will-change:transform}
svg{overflow:visible}
.ctr{position:absolute;left:0;top:0;white-space:nowrap}

.cm{position:absolute;width:30px;height:30px;border:0 solid currentColor}

.hud-t img{width:32px;height:27px}
.rec{display:inline-block;width:9px;height:9px;border-radius:50%;background:#EE5A32}

.callout .k{font-family:"Geist Mono",monospace;font-size:15px;letter-spacing:.18em;color:var(--caramel)}
.callout .v{font-size:30px;font-weight:720;letter-spacing:-.03em;color:var(--espresso);margin-top:4px}
.panel{position:absolute;left:0;top:0;width:1080px;height:1350px;overflow:hidden}
.mk{position:relative;display:inline-block;z-index:0}
.mk::before{content:"";position:absolute;left:-.05em;right:-.07em;top:.5em;height:.4em;background:var(--lime);border-radius:.08em;z-index:-1}
</style>

function renderAt(t) {

// A · lime drop → espresso iris
function intro(t) {
  const on = t < 1.2; vis(sA, on); if (!on) return;
  const R = 28, G = 703;
  let y = -80, sx = 1, sy = 1, col = C.lime;
  if (t < .05) y = -80;
  else if (t < .4) { const k = eInQuad(P(t, .05, .4)); y = lerp(-80, 675, k); sy = 1 + .3 * k; sx = 1 - .15 * k; }
  else if (t < .48) { const k = Math.sin(Math.PI * P(t, .4, .48)); sy = 1 - .42 * k; sx = 1 + .42 * k; y = G - R * sy; }
  else if (t < .64) { const k = eOutQuad(P(t, .48, .64)); y = lerp(675, 560, k); }
  else { const k = eInQuad(P(t, .64, .8)); y = lerp(560, 675, k); }
  const grow = P(t, .6, .8);
  const r = R * lerp(1, 1.5, grow);
  A(ballA, { cy: y, rx: r * sx, ry: r * sy, fill: grow > .5 ? C.esp : C.lime });
  A(shA, { opacity: t < .05 ? 0 : (1 - cl((675 - y) / 700)) * (1 - P(t, .8, .9)), rx: 44 * (1 - cl((675 - y) / 700) * .6) });
  const tk = eOutExpo(P(t, .1, .5));
  at(tagA, CX, 820, `translateY(${(1 - tk) * 20}px)`, tk * (1 - P(t, .7, .82)));
}

// C · the cup assembles itself
function build(t) {
  const on = t > 2.98 && t < 7.02; vis(sC, on); if (!on) return;
  // latte iris from the splash point
  sC.style.clipPath = t < 3.42 ? `circle(${lerp(0, 1500, eInOutCubic(P(t, 3.0, 3.42)))}px at 540px 820px)` : "";
  // zoom into the coffee → match cut to the first beat
  const z = eInExpo(P(t, 6.55, 7.0));
  sC.style.transform = `scale(${lerp(1, 7.5, z) * (1 + .03 * P(t, 3.4, 6.55))})`;
  sC.style.filter = z > .05 ? `blur(${z * 6}px)` : "none";
  cT1w.forEach((w, i) => { const k = eOutExpo(P(t, 3.35 + i * .06, 3.95 + i * .06)); T(w, `translateY(${(1 - k) * 105}%)`); });
  cT2w.forEach((w, i) => { const k = eOutExpo(P(t, 3.5 + i * .07, 4.1 + i * .07)); T(w, `translateY(${(1 - k) * 105}%)`); });
  at(cTitle, CX, 272);
  // cup draw
  const cd = eInOutCubic(P(t, 3.25, 3.75));
  A(cupGlass, { "stroke-dashoffset": 1 - cd, "fill-opacity": P(t, 3.5, 3.8) });
  A(rim, { "stroke-dashoffset": 1 - eInOutCubic(P(t, 3.45, 3.85)) });
  A(cupShadow, { opacity: cd });
  // layers: aren → milk (wavy) → espresso marble
  const arenY = lerp(1100, 985, eOutCubic(P(t, 3.6, 3.95)));
  A(arenR, { y: arenY });
  const milkTop = lerp(1100, 668, eInOutCubic(P(t, 3.85, 4.4)));
  const amp = 14 * (1 - P(t, 4.4, 5.6)) + 2;
  const milkBot = Math.max(milkTop, arenY + 3); // milk sits on top of the aren layer
  let d = `M300 ${milkBot} L300 ${milkTop}`;
  for (let x = 300; x <= 780; x += 20) d += ` L${x} ${milkTop + Math.sin(x / 38 + t * 9) * amp}`;
  d += ` L780 ${milkBot} Z`;
  A(milkP, { d });
  const eDepth = lerp(0, 190, eOutCubic(P(t, 4.15, 4.9)));
  let e = `M300 ${milkTop - 20}`;
  for (let x = 300; x <= 780; x += 20) e += ` L${x} ${milkTop + Math.sin(x / 38 + t * 9) * amp}`;
  for (let x = 780; x >= 300; x -= 20) e += ` L${x} ${milkTop + eDepth * (.62 + .22 * Math.sin(x / 70 + 1.7 + t * 1.1) + .12 * Math.sin(x / 26 + t * 2.3))}`;
  e += " Z";
  A(espP, { d: e, opacity: eDepth > 1 ? .9 : 0 });
  // espresso pour stream
  const sk = P(t, 4.0, 4.25), sEnd = P(t, 4.55, 4.75);
  const top = lerp(440, milkTop, sEnd), bot = lerp(440, milkTop, eOutCubic(sk));
  A(stream, { y: top, height: Math.max(0, bot - top), opacity: t > 4.0 && t < 4.76 ? 1 : 0 });
  // ice cubes drop with bounce
  ices.forEach((g, i) => {
    const c = ICE[i], st = 4.45 + i * .1, k = eOutBack(P(t, st, st + .45), 2.2);
    const bob = t > st + .45 ? Math.sin((t - st) * 3 + i) * 4 : 0;
    A(g, { transform: `translate(${c.x} ${lerp(-150, c.y, k) + bob}) rotate(${c.r + (1 - k) * 60})`, opacity: t > st ? 1 : 0 });
  });
  // straw slides in
  const sw = eOutBack(P(t, 4.85, 5.2), 1.6);
  A(straw, { transform: `translate(620 ${lerp(-500, 750, sw)}) rotate(14)` });
  // condensation
  drops.forEach((dr, i) => A(dr, { opacity: cl(P(t, 5.0 + hash(i + 50) * .5, 5.3 + hash(i + 50) * .5)) * .85 }));
  // callouts
  callEls.forEach((c, i) => {
    const st = 5.2 + i * .18, k = eInOutCubic(P(t, st, st + .35));
    A(c.line, { "stroke-dashoffset": 1 - k });
    A(c.dot, { r: 9 * eOutBack(P(t, st - .05, st + .15), 3) });
    const bk = eOutExpo(P(t, st + .2, st + .6));
    T(c.box, `translateY(${(1 - bk) * 16}px)`, bk);
  });
}

  const cardB = 560 + 378;
  const bk = eOutExpo(P(t, 13.8, 14.2));
  Object.assign(gBar.style, { left: 540 - 302 + "px", top: cardB + 30 + "px", opacity: bk });
  gFill.style.width = 605 * bk + "px"; gHead.style.left = 605 * bk - 9 + "px";
  at(gTime, 540 + 302 - 70, cardB + 58, "", bk);
  at(gPlay, 540 - 302 + 100, 560 - 378 + 46, `scale(${spring(t - 13.9, 1.8, 7) * (t > 13.9 ? 1 : 0)})`);
  [...gT1w, ...gT1b].forEach((w, i) => { const q = eOutExpo(P(t, 13.85 + i * .05, 14.45 + i * .05)); T(w, `translateY(${(1 - q) * 105}%)`); });
  at(gT, CX, 1115);
  const sk = eOutExpo(P(t, 14.3, 14.7));
  gSub.style.opacity = sk; gSub.style.transform = `translateY(${(1 - sk) * 14}px)`;
  gMk.classList.toggle("mk", t > 14.25);
}

// HUD adapts to dark scenes
function hudUpdate(t, frame) {
  const dark = (t > .98 && t < 3.25) || (t > 6.9 && t < 8.85);
  const col = dark ? "#F6E9D7" : C.ink;
  hud.style.color = col;
  hLogo.style.filter = dark ? "invert(1) brightness(1.6)" : "none";
  const ck = eOutExpo(P(t, .02, .5));
  crops.forEach(c => { c.style.opacity = ck; });
  [hTL, hTR, hBL, hBR].forEach(e => e.style.opacity = P(t, .1, .4));
  const f = Math.min(frame, DUR * FPS);
  hTC.textContent = `00:00:${pad(Math.floor(f / FPS))}:${pad(f % FPS)}`;
  hRec.style.opacity = Math.floor(t * 2) % 2 ? .3 : 1;
}

window.renderAt = renderAt;
window.DURATION = DUR;
window.reelReady = (async () => {
  await document.fonts.ready;
  await document.fonts.load('900 40px "Geist"'); await document.fonts.load('40px "Geist Mono"'); await document.fonts.load('italic 40px "Instrument Serif"');
  await Promise.all([...document.images].map(i => i.decode().catch(() => {})));
  renderAt(0);
  return true;
})();
function fit() {
  const vp = document.getElementById("viewport");
  if (CAPTURE) { vp.style.transform = "none"; return; }
  const z = Math.min(innerWidth / W, innerHeight / H);
  vp.style.transform = `scale(${z})`;
  vp.style.marginRight = (W * z - W) + "px"; vp.style.marginBottom = (H * z - H) + "px";
}
addEventListener("resize", fit); fit();
if (!CAPTURE) {
  let paused = false, last = performance.now(), cur = 0;
  addEventListener("keydown", e => {
    if (e.code === "Space") { paused = !paused; e.preventDefault(); }
    if (e.code === "ArrowRight") cur = Math.min(DUR, cur + (e.shiftKey ? 1 : 1 / FPS));
    if (e.code === "ArrowLeft") cur = Math.max(0, cur - (e.shiftKey ? 1 : 1 / FPS));
  });
  window.reelReady.then(() => {
    last = performance.now();
    const loop = now => { if (!paused) { cur += (now - last) / 1000; if (cur > DUR + 1.2) cur = 0; } last = now; renderAt(Math.min(cur, DUR)); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  });
}
