<!--
  8-second 4:5 (1080×1350) showcase of two example websites, stacked top/bottom in browser frames,
  for the Website & SaaS carousel. Both brands are FICTIONAL. Motion is intentionally calm:
  frames settle in, each page plays a Framer-style load-in, then scrolls gently once.

<style>
@font-face{font-family:"Geist";src:url(fonts/Geist-normal.woff2) format("woff2");font-weight:100 900;font-display:block}
@font-face{font-family:"Geist Mono";src:url(fonts/GeistMono-normal.woff2) format("woff2");font-weight:100 900;font-display:block}
@font-face{font-family:"Instrument Serif";src:url(fonts/InstrumentSerif-normal.woff2) format("woff2");font-style:normal;font-display:block}
@font-face{font-family:"Instrument Serif";src:url(fonts/InstrumentSerif-italic.woff2) format("woff2");font-style:italic;font-display:block}
:root{--cream:#FAF7F0;--ink:#05100E;--lime:#D4E751;--emerald:#17463A;--line:#E6DFD0;--muted:#7F8277}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#15130F}
body{display:flex;align-items:center;justify-content:center;overflow:hidden}
body.capture{display:block;background:var(--cream)}
#viewport{position:relative;width:1080px;height:1350px;transform-origin:0 0;flex:none}
#stage{position:absolute;inset:0;overflow:hidden;background:var(--cream);color:var(--ink);font-family:"Geist",sans-serif;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
.layer{position:absolute;inset:0}
.abs{position:absolute;left:0;top:0}
.mono{font-family:"Geist Mono",monospace}
.serif{font-family:"Instrument Serif",serif;font-style:italic;font-weight:400}
svg{overflow:visible}
#grid{background-size:60px 60px;background-image:linear-gradient(to right, rgba(5,16,14,.045) 1px, transparent 1px),linear-gradient(to bottom, rgba(5,16,14,.045) 1px, transparent 1px)}
#glow{background:radial-gradient(ellipse 60% 40% at 50% 50%, rgba(212,231,81,.22), rgba(212,231,81,0) 70%)}
#grain{width:1080px;height:1350px;mix-blend-mode:multiply;opacity:.28;pointer-events:none}
#vig{background:radial-gradient(ellipse 85% 75% at 50% 46%, rgba(0,0,0,0) 55%, rgba(98,80,40,.08) 100%);pointer-events:none}
/* HUD (Otak Rental frame) */
#hud{font-family:"Geist Mono",monospace;font-size:15px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink)}
.cm{position:absolute;width:30px;height:30px;border:0 solid var(--ink)}
.hud-t{position:absolute;white-space:nowrap;display:flex;align-items:center;gap:10px}
.hud-t img{width:32px;height:27px}
.rec{display:inline-block;width:9px;height:9px;border-radius:50%;background:#EE5A32}
.lbl{position:absolute;left:60px;width:960px;display:flex;align-items:center;justify-content:space-between;font-family:"Geist Mono",monospace;font-size:15px;letter-spacing:.16em;text-transform:uppercase;white-space:nowrap}
.lbl b{font-weight:700}
.lbl .chips{display:flex;gap:8px}
.lbl .chips span{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:#FFFDF8;border-radius:9px;padding:6px 10px;font-size:12px;letter-spacing:.14em;color:#474b44}
.lbl .chips i{width:7px;height:7px;border-radius:50%;background:var(--lime);box-shadow:0 0 0 3px rgba(212,231,81,.35)}

/* browser frame */
.win{position:absolute;left:60px;width:960px;height:500px;border-radius:22px;overflow:hidden;background:#fff;border:1px solid rgba(5,16,14,.12);
  box-shadow:0 40px 80px -40px rgba(40,34,20,.55),0 2px 0 rgba(5,16,14,.04)}

.bar i{width:11px;height:11px;border-radius:50%}
.url{position:absolute;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;background:#fff;border:1px solid rgba(5,16,14,.08);border-radius:8px;padding:5px 16px;font-family:"Geist Mono",monospace;font-size:12.5px;color:#5d6158;letter-spacing:.02em}
.vp{position:absolute;left:0;top:40px;width:1280px;height:613px;transform:scale(.75);transform-origin:0 0;overflow:hidden}
.page{position:absolute;left:0;top:0;width:1280px}

  </defs>
  <ellipse cx="300" cy="352" rx="250" ry="18" fill="url(#shd)"/>
  <path d="M118 210 C 110 40, 490 40, 482 210" fill="none" stroke="#8E8F97" stroke-width="34" stroke-linecap="round"/>
  <path d="M118 210 C 110 40, 490 40, 482 210" fill="none" stroke="url(#band)" stroke-width="28" stroke-linecap="round"/>
  <path d="M150 170 C 150 80, 450 80, 450 170" fill="none" stroke="#2B2C31" stroke-width="16" stroke-linecap="round"/>
  <rect x="104" y="170" width="26" height="70" rx="10" fill="#C9CAD1" stroke="#9A9BA3" stroke-width="2"/>
  <rect x="470" y="170" width="26" height="70" rx="10" fill="#C9CAD1" stroke="#9A9BA3" stroke-width="2"/>
  <rect x="44" y="214" width="140" height="150" rx="58" fill="url(#cup)" stroke="#9A9BA3" stroke-width="2"/>
  <rect x="416" y="214" width="140" height="150" rx="58" fill="url(#cup2)" stroke="#9A9BA3" stroke-width="2"/>
  <rect x="160" y="226" width="30" height="126" rx="15" fill="#2B2C31"/>
  <rect x="410" y="226" width="30" height="126" rx="15" fill="#2B2C31"/>
  <path d="M70 240 C 66 270, 66 310, 74 336" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" opacity=".8"/>
  <circle cx="530" cy="250" r="7" fill="#9A9BA3"/>
</svg>`;
const pageB = $("div", { cls: "page pb", html: `
  <div class="gn"><svg width="16" height="16" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#1D1D1F"/><path d="M6 13c2-4 4 4 6 0s4 4 6 0" fill="none" stroke="#FBFBFD" stroke-width="2" stroke-linecap="round"/></svg><span>Store</span><span>Headphone</span><span>Speaker</span><span>Aksesori</span><span>Dukungan</span>
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#1D1D1F" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#1D1D1F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7h12l-1 14H7L6 7Z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg></div>
  <div class="sn"><span class="t">Lumo Max</span><span class="r"><span>Ringkasan</span><span>Spesifikasi</span><span class="buy">Beli</span></span></div>
  <section class="hero">
    <div class="eb r">Baru</div>
    <h1 class="r">Lumo Max</h1>
    <div class="tg r">Sunyi. Sepenuhnya.</div>
    <div class="lk r"><span>Pelajari lebih lanjut ›</span><span>Beli ›</span></div>
    <div id="phones" style="margin-top:6px;display:inline-block">${PHONES(470)}</div>
  </section>
  <section class="dark">
    <div class="k r2">Baterai</div>
    <h2 class="r2">Hingga <span class="g">40 jam.</span></h2>
    <p class="r2">Sekali cas, temani perjalanan pulang-pergi sepekan penuh.</p>
    <div class="sw r2"><div><i style="background:#2B2C31"></i>Midnight</div><div><i style="background:#D9DAE0"></i>Silver</div><div><i style="background:#9EC3E6"></i>Sky</div><div><i style="background:#E8B4B8"></i>Rose</div></div>
    <div class="specs r2"><span>ANC adaptif</span><span>Audio spasial</span><span>USB‑C</span></div>
  </section>` }, vpB);
const bR = qa(pageB, ".r"), bR2 = qa(pageB, ".r2");
const bNav = [q(pageB, ".gn"), q(pageB, ".sn")];
const phones = q(pageB, "#phones");

// ---------- grain / vignette / HUD ----------
$("div", { cls: "layer", id: "vig" });
const grainCv = $("canvas", { cls: "abs", id: "grain" });
grainCv.width = 540; grainCv.height = 675;
const gctx = grainCv.getContext("2d");
const GRAIN = [...Array(6)].map((_, k) => {
  const img = gctx.createImageData(540, 675); let s = 555 + k * 101;
  for (let i = 0; i < img.data.length; i += 4) {
    s = (s * 1664525 + 1013904223) >>> 0; const v = 255 - ((s >>> 24) & 63) * (((s >>> 8) & 7) === 0 ? 1.4 : .5);
    img.data[i] = v; img.data[i + 1] = v - 2; img.data[i + 2] = v - 6; img.data[i + 3] = 255;
  } return img;
});
const hud = $("div", { cls: "layer", id: "hud" });
[[40, 40, "Top", "Left"], [1010, 40, "Top", "Right"], [40, 1280, "Bottom", "Left"], [1010, 1280, "Bottom", "Right"]].forEach(([x, y, a, b]) =>
  $("div", { cls: "cm", style: { left: x + "px", top: y + "px", ["border" + a + "Width"]: "2px", ["border" + b + "Width"]: "2px" } }, hud));
$("div", { cls: "hud-t", html: `<img src="assets/logo-icon-dark.png" alt=""><b>OTAK RENTAL</b><span>/ Contoh website</span>`, style: { left: "92px", top: "58px" } }, hud);
$("div", { cls: "hud-t", text: "Website & SaaS", style: { right: "92px", top: "64px" } }, hud);
$("div", { cls: "hud-t", text: "Brand fiktif · untuk demo", style: { left: "92px", bottom: "40px", top: "auto" } }, hud).style.bottom = "38px";
const hBR = $("div", { cls: "hud-t", html: `<span class="rec"></span><span class="tc">00:00:00:00</span>`, style: { right: "92px" } }, hud);
hBR.style.bottom = "38px";
const hTC = q(hBR, ".tc"), hRec = q(hBR, ".rec");

/* ==========================================================================
   RENDER
   ========================================================================== */
function renderAt(t) {
  t = cl(t, 0, DUR);
  const frame = Math.round(t * FPS);
  gctx.putImageData(GRAIN[Math.floor(t * 12) % GRAIN.length], 0, 0);

  // frames + labels settle in (the only "big" move)
  [[lblA, winA, 0], [lblB, winB, .12]].forEach(([l, w, d]) => {
    const k = eOutExpo(P(t, .05 + d, .95 + d));
    l.style.opacity = cl(P(t, .1 + d, .5 + d)); l.style.transform = `translateY(${(1 - k) * 16}px)`;
    w.style.opacity = cl(P(t, .05 + d, .35 + d)); w.style.transform = `translateY(${(1 - k) * 70}px) scale(${lerp(.96, 1, k)})`;
  });

  siteA(t); siteB(t);

  hTC.textContent = `00:00:${pad(Math.floor(Math.min(frame, DUR * FPS) / FPS))}:${pad(Math.min(frame, DUR * FPS) % FPS)}`;
  hRec.style.opacity = Math.floor(t * 2) % 2 ? .3 : 1;
}

function siteA(t) {
  // gentle single scroll to the menu, then hold
  const sc = 500 * eInOutQuint(P(t, 3.0, 5.4));
  pageA.style.transform = `translateY(${-sc}px)`;
  reveal(aNav, eOutCubic(P(t, .55, 1.0)), -12, 0);
  aR.forEach((el, i) => reveal(el, eOutExpo(P(t, .75 + i * .12, 1.55 + i * .12)), 28, 10));
  // cartoon: sun + mascot spring in, then idle loops
  const pop = spring(t - 1.0, 1.5, 6) * (t > 1.0 ? 1 : 0);
  toon.sun.setAttribute("r", 215 * eOutExpo(P(t, .85, 1.5)));
  toon.m.setAttribute("transform", `translate(300 460) scale(${pop}) translate(-300 -460) translate(0 ${Math.sin(t * 3.2) * 5 * P(t, 1.6, 2)})`);
  toon.sh.setAttribute("transform", `translate(300 470) scale(${pop * (1 - .05 * Math.sin(t * 3.2))} 1) translate(-300 -470)`);
  const wave = t > 1.4 ? Math.sin((t - 1.4) * 9) * 22 : 0;
  toon.arm.setAttribute("transform", `rotate(${wave} 438 300)`);
  const blink = [2.6, 5.9].some(b => t > b && t < b + .12);
  toon.eyes.setAttribute("transform", blink ? "translate(0 318) scale(1 .12) translate(0 -318)" : "");
  toon.c1.setAttribute("transform", `translate(${Math.sin(t * .8) * 10 + (1 - eOutCubic(P(t, .9, 1.6))) * -120} 0)`);
  toon.c2.setAttribute("transform", `translate(${Math.cos(t * .7) * 8 + (1 - eOutCubic(P(t, 1.0, 1.7))) * 120} 0)`);
  const dk = eOutExpo(P(t, 1.3, 1.9));
  toon.donut.setAttribute("transform", `translate(80 ${330 + Math.sin(t * 2.4) * 10 + (1 - dk) * 80}) rotate(${t * 20}) scale(${.62 * dk})`);
  [[toon.s1, 470, 380, 1.5], [toon.s2, 150, 110, 1.65]].forEach(([s, x, y, st]) => {
    const k = spring(t - st, 1.8, 6) * (t > st ? 1 : 0);
    s.setAttribute("transform", `translate(${x} ${y}) rotate(${t * 40}) scale(${k * (1 + .15 * Math.sin(t * 5))})`);
  });
  // menu reveals as it scrolls into view
  aR2.forEach((el, i) => reveal(el, eOutExpo(P(t, 3.9 + i * .12, 4.7 + i * .12)), 36, 6));
}

function siteB(t) {
  const sc = 430 * eInOutQuint(P(t, 3.2, 5.6));
  pageB.style.transform = `translateY(${-sc}px)`;
  bNav.forEach(n => reveal(n, eOutCubic(P(t, .65, 1.1)), -10, 0));
  bR.forEach((el, i) => reveal(el, eOutExpo(P(t, .95 + i * .12, 1.9 + i * .12)), 30, 12));
  const pk = eOutExpo(P(t, 1.35, 2.5));
  reveal(phones, pk, 70, 14, .08);
  if (pk >= 1) phones.style.transform = `translateY(${Math.sin(t * 1.6) * 5}px)`;
  // dark section: headline scales up like a product-page "whileInView"
  bR2.forEach((el, i) => reveal(el, eOutExpo(P(t, 4.3 + i * .1, 5.2 + i * .1)), 34, 10, i === 1 ? .06 : 0));
}

/* ==========================================================================
   BOOT
   ========================================================================== */
window.renderAt = renderAt;
window.DURATION = DUR;
window.reelReady = (async () => {
  await document.fonts.ready;
  await document.fonts.load('900 40px "Geist"'); await document.fonts.load('40px "Geist Mono"'); await document.fonts.load('italic 40px "Instrument Serif"');
  await Promise.all([...document.images].map(i => i.decode().catch(() => {})));
  renderAt(0);
  return true;
})();
function fit() {
  const vp = document.getElementById("viewport");
  if (CAPTURE) { vp.style.transform = "none"; return; }
  const z = Math.min(innerWidth / W, innerHeight / H);
  vp.style.transform = `scale(${z})`;
  vp.style.marginRight = (W * z - W) + "px"; vp.style.marginBottom = (H * z - H) + "px";
}
addEventListener("resize", fit); fit();
if (!CAPTURE) {
  let paused = false, last = performance.now(), cur = 0;
  addEventListener("keydown", e => { if (e.code === "Space") { paused = !paused; e.preventDefault(); } });
  window.reelReady.then(() => {
    last = performance.now();
    const loop = now => { if (!paused) { cur += (now - last) / 1000; if (cur > DUR + 1) cur = 0; } last = now; renderAt(Math.min(cur, DUR)); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  });
}
</script>
