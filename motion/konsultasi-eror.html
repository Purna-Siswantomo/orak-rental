<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Otak Rental — Otakmu lagi eror?</title>
<!--
  7-second 4:5 (1080×1350) motion version of slide 2 of the Konsultasi Tugas carousel.
  Story: "eror?" glitches → otak.exe error dialog pops and cascades → cursor clicks "Sewa otak"
  → loading → "otak.exe kembali normal" → "Tenang pren, ada Otak Rental."
  Render: node render.mjs --page konsultasi-eror.html --width 1080 --height 1350 --name otak-rental-konsultasi-eror --sound eror_sound.py
-->
<style>
@font-face{font-family:"Geist";src:url(fonts/Geist-normal.woff2) format("woff2");font-weight:100 900;font-display:block}
@font-face{font-family:"Geist Mono";src:url(fonts/GeistMono-normal.woff2) format("woff2");font-weight:100 900;font-display:block}
@font-face{font-family:"Instrument Serif";src:url(fonts/InstrumentSerif-normal.woff2) format("woff2");font-style:normal;font-display:block}
@font-face{font-family:"Instrument Serif";src:url(fonts/InstrumentSerif-italic.woff2) format("woff2");font-style:italic;font-display:block}
:root{--cream:#FAF7F0;--paper:#FFFDF8;--ink:#05100E;--lime:#D4E751;--emerald:#17463A;--muted:#7F8277;--line:#E6DFD0;--coral:#EE5A32}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#15130F}
body{display:flex;align-items:center;justify-content:center;overflow:hidden}
body.capture{display:block;background:var(--cream)}
#viewport{position:relative;width:1080px;height:1350px;transform-origin:0 0;flex:none}
#stage{position:absolute;inset:0;overflow:hidden;background:var(--cream);color:var(--ink);font-family:"Geist",sans-serif;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
.layer{position:absolute;inset:0}
.abs{position:absolute;left:0;top:0}
.mono{font-family:"Geist Mono",monospace}
svg{overflow:visible}
#grid{background-size:60px 60px;background-image:linear-gradient(to right, rgba(5,16,14,.045) 1px, transparent 1px),linear-gradient(to bottom, rgba(5,16,14,.045) 1px, transparent 1px)}
#glow{background:radial-gradient(circle at 0% 0%, rgba(212,231,81,.22), rgba(212,231,81,0) 45%)}
#grain{width:1080px;height:1350px;mix-blend-mode:multiply;opacity:.3;pointer-events:none}
#vig{background:radial-gradient(ellipse 85% 75% at 50% 45%, rgba(0,0,0,0) 55%, rgba(98,80,40,.07) 100%);pointer-events:none}
.mask{display:inline-block;overflow:hidden;vertical-align:top;padding:.06em .12em .16em;margin:-.06em -.12em -.16em}
.ch,.wd{display:inline-block;will-change:transform}
.sans{font-weight:820;letter-spacing:-.055em;line-height:.95;white-space:nowrap}
.ser{font-family:"Instrument Serif",serif;font-style:italic;font-weight:400;color:var(--emerald);letter-spacing:-.015em;line-height:.95;white-space:nowrap}
.mk{position:relative;display:inline-block;z-index:0}
.mk>i{position:absolute;left:-.05em;right:-.07em;top:.5em;height:.4em;background:var(--lime);border-radius:.08em;z-index:-1;transform-origin:0 50%}
.chip{display:inline-flex;align-items:center;gap:12px;border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:12px 18px;
  font-family:"Geist Mono",monospace;font-size:16px;letter-spacing:.16em;color:#40443d;text-transform:uppercase;white-space:nowrap;box-shadow:0 10px 24px -16px rgba(40,34,20,.3)}
.chip i{width:10px;height:10px;border-radius:50%;background:var(--lime);box-shadow:0 0 0 4px rgba(212,231,81,.35)}
/* HUD */
#hud{font-family:"Geist Mono",monospace;font-size:15px;letter-spacing:.16em;text-transform:uppercase}
.cm{position:absolute;width:30px;height:30px;border:0 solid var(--ink)}
.hud-t{position:absolute;white-space:nowrap;display:flex;align-items:center;gap:12px}
.hud-t b{font-weight:700}
.hud-t img{width:34px;height:29px}
.dots{display:flex;gap:8px;align-items:center}
.dots i{width:9px;height:9px;border-radius:50%;background:rgba(5,16,14,.2)}
.dots i.on{width:28px;border-radius:9px;background:var(--ink)}
/* dialog */
.dlg{position:absolute;left:110px;top:640px;width:860px;height:330px;border-radius:24px;overflow:hidden;border:2.5px solid var(--ink);background:var(--paper);box-shadow:10px 12px 0 var(--ink)}
.dlg .tb{height:54px;background:var(--ink);display:flex;align-items:center;padding:0 22px;gap:10px}
.dlg .tb i{width:12px;height:12px;border-radius:50%}
.dlg .tb span{margin-left:14px;font-family:"Geist Mono",monospace;font-size:15px;letter-spacing:.12em;color:rgba(255,255,255,.72)}
.dlg .body{position:absolute;left:0;top:54px;right:0;bottom:0}
.dlg .row{display:flex;gap:26px;padding:30px 34px 0}
.dlg .ttl{font-size:36px;font-weight:780;letter-spacing:-.03em}
.dlg .sub{font-family:"Geist Mono",monospace;font-size:17px;letter-spacing:.06em;color:#63665e;margin-top:10px;line-height:1.6}
.btn{border:2px solid var(--ink);border-radius:12px;padding:12px 22px;font-size:20px;font-weight:650;background:#fff;display:inline-block}
</style>
</head>
<body>
<div id="viewport"><div id="stage"></div></div>
<script>
"use strict";
const W = 1080, H = 1350, DUR = 7, FPS = 60;
const stage = document.getElementById("stage");
const CAPTURE = /capture/.test(location.search);
if (CAPTURE) document.body.classList.add("capture");

const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const P = (t, a, b) => cl((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const eOutExpo = x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x);
const eInExpo = x => x <= 0 ? 0 : Math.pow(2, 10 * x - 10);
const eOutCubic = x => 1 - Math.pow(1 - x, 3);
const eInOutCubic = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eInOutExpo = x => x <= 0 ? 0 : x >= 1 ? 1 : x < .5 ? Math.pow(2, 20 * x - 10) / 2 : (2 - Math.pow(2, -20 * x + 10)) / 2;
const eInBack = (x, s = 1.70158) => (s + 1) * x * x * x - s * x * x;
const spring = (x, f = 2.2, d = 7) => x <= 0 ? 0 : 1 - Math.exp(-d * x) * Math.cos(f * 2 * Math.PI * x);
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const noise1 = x => { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return lerp(hash(i), hash(i + 1), u) * 2 - 1; };
const pad = (n, l = 2) => String(Math.floor(n)).padStart(l, "0");
function $(tag, o = {}, parent = stage) {
  const el = document.createElement(tag);
  if (o.cls) el.className = o.cls;
  if (o.id) el.id = o.id;
  if (o.html != null) el.innerHTML = o.html;
  if (o.text != null) el.textContent = o.text;
  if (o.style) Object.assign(el.style, o.style);
  parent.appendChild(el);
  return el;
}
const q = (r, s) => r.querySelector(s);
function letters(parent, text) {
  const m = $("span", { cls: "mask" }, parent);
  return [...text].map(c => $("span", { cls: "ch", text: c === " " ? " " : c }, m));
}
function words(parent, text) {
  return text.split(" ").map((w, i, arr) => {
    const m = $("span", { cls: "mask" }, parent);
    const s = $("span", { cls: "wd", text: w }, m);
    if (i < arr.length - 1) parent.appendChild(document.createTextNode(" "));
    return s;
  });
}

/* ==========================================================================
   BUILD
   ========================================================================== */
$("div", { cls: "layer", id: "grid" });
$("div", { cls: "layer", id: "glow" });
// carousel trail (matches the static carousel so the video drops in as slide 2)
$("div", { cls: "abs", html: `<svg width="1080" height="200"><path d="M -40 118 C 300 104, 700 132, 1120 118" fill="none" stroke="#05100E" stroke-width="2" stroke-dasharray="3 10" stroke-linecap="round" opacity=".38"/><circle cx="0" cy="118" r="14" fill="#D4E751" stroke="#05100E" stroke-width="3"/><circle cx="1080" cy="118" r="14" fill="#D4E751" stroke="#05100E" stroke-width="3"/></svg>` });

const chip = $("div", { cls: "abs", html: `<span class="chip"><i></i>Diagnosa</span>`, style: { left: "92px", top: "150px" } });
const head = $("div", { cls: "abs", style: { left: "84px", top: "222px" } });
const hl1 = $("div", { cls: "sans", style: { fontSize: "176px" } }, head);
const hl1L = letters(hl1, "Otakmu");
const hl2 = $("div", { style: { display: "flex", alignItems: "baseline", gap: "30px" } }, head);
const lagi = $("div", { cls: "sans", style: { fontSize: "176px" } }, hl2);
const lagiL = letters(lagi, "lagi");
const eror = $("div", { style: { position: "relative" } }, hl2);
const erR = $("span", { cls: "ser", text: "eror?", style: { fontSize: "210px", position: "absolute", left: "0", top: "0", color: "#EE5A32", opacity: ".7" } }, eror);
const erC = $("span", { cls: "ser", text: "eror?", style: { fontSize: "210px", position: "absolute", left: "0", top: "0", color: "#6FC3D8", opacity: ".7" } }, eror);
const erM = $("span", { cls: "ser", text: "eror?", style: { fontSize: "210px", position: "relative", display: "inline-block" } }, eror);
// glitch slices: copies of the word clipped to horizontal bands and shoved sideways
const slices = [0, 1, 2].map(() => $("span", { cls: "ser", text: "eror?", style: { fontSize: "210px", position: "absolute", left: "0", top: "0" } }, eror));

// cascade of duplicate dialogs (behind the main one)
const MINI = `<div class="tb"><i style="background:#EE5A32"></i><i style="background:#F1C27B"></i><i style="background:#D4E751"></i><span>OTAK.EXE — SYSTEM ERROR</span></div>
  <div class="body"><div class="row"><div class="ttl">otak.exe tidak merespons</div></div></div>`;
const cascade = [0, 1, 2].map(() => $("div", { cls: "dlg", html: MINI }));

const WARN = `<svg width="84" height="84" viewBox="0 0 24 24" fill="#F1C27B" stroke="#05100E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4" fill="none"/><path d="M12 17h.01" fill="none"/></svg>`;
const OK = `<svg width="84" height="84" viewBox="0 0 24 24" style="flex:none"><circle cx="12" cy="12" r="10" fill="#D4E751" stroke="#05100E" stroke-width="1.6"/><path d="M7.5 12.5l3 3 6-6.5" fill="none" stroke="#05100E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const dlg = $("div", { cls: "dlg", html: `
  <div class="tb"><i style="background:#EE5A32"></i><i style="background:#F1C27B"></i><i style="background:#D4E751"></i><span class="tbt">OTAK.EXE — SYSTEM ERROR</span></div>
  <div class="body st-err">
    <div class="row">${WARN}<div><div class="ttl">otak.exe tidak merespons</div><div class="sub">Terlalu banyak tab terbuka: <b class="n1">0</b> tugas,<br><b class="n2">0</b> deadline, <b class="n3">0</b> jam tidur.</div></div></div>
    <div style="position:absolute;right:34px;bottom:30px;display:flex;gap:14px"><span class="btn">Paksa tutup</span><span class="btn b-sewa" style="font-weight:750;background:var(--lime)">Sewa otak</span></div>
  </div>
  <div class="body st-load" style="padding:44px 40px">
    <div class="ttl">Menyewa otak…</div>
    <div class="sub ld">Menghubungkan ke Otak Rental</div>
    <div style="margin-top:26px;height:22px;border-radius:12px;border:2px solid var(--ink);overflow:hidden;background:#fff"><div class="bar" style="height:100%;width:0;background:var(--lime);border-right:2px solid var(--ink)"></div></div>
    <div class="mono pct" style="font-size:16px;letter-spacing:.14em;margin-top:12px;color:#40443d">0%</div>
  </div>
  <div class="body st-ok">
    <div class="row">${OK}<div><div class="ttl">otak.exe kembali normal</div><div class="sub">Otak Rental terhubung. Tugas siap<br>dikerjain bareng, pelan-pelan.</div></div></div>
    <div style="position:absolute;right:34px;bottom:30px"><span class="btn b-ok" style="font-weight:750;background:var(--lime)">Mantap</span></div>
  </div>` });
const tbar = q(dlg, ".tb"), tbt = q(dlg, ".tbt");
const stErr = q(dlg, ".st-err"), stLoad = q(dlg, ".st-load"), stOk = q(dlg, ".st-ok");
const n1 = q(dlg, ".n1"), n2 = q(dlg, ".n2"), n3 = q(dlg, ".n3"), bSewa = q(dlg, ".b-sewa"), bar = q(dlg, ".bar"), pct = q(dlg, ".pct"), bOk = q(dlg, ".b-ok");
const warnIco = q(stErr, "svg");

// cursor + click ripple
const ripple = $("div", { cls: "abs", style: { width: "20px", height: "20px", borderRadius: "50%", border: "3px solid #05100E", marginLeft: "-10px", marginTop: "-10px" } });
const cursor = $("div", { cls: "abs", html: `<svg width="54" height="62" viewBox="0 0 24 28"><path d="M3 2 L3 22 L8.5 17 L12 26 L15.5 24.5 L12 16 L19.5 16 Z" fill="#05100E" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>` });

// resolution line
const foot = $("div", { cls: "abs", style: { left: "84px", top: "1030px" } });
const f1 = $("div", { cls: "sans", style: { fontSize: "84px" } }, foot);
const f1w = words(f1, "Tenang pren,");
const f2 = $("div", { cls: "ser", style: { fontSize: "100px", marginTop: "-2px" } }, foot);
const f2a = words(f2, "ada");
f2.appendChild(document.createTextNode(" "));
const mk = $("span", { cls: "mk" }, f2);
const mkBar = $("i", {}, mk);
const f2b = words(mk, "Otak Rental.");

// grain / vignette / HUD
$("div", { cls: "layer", id: "vig" });
const grainCv = $("canvas", { cls: "abs", id: "grain" });
grainCv.width = 540; grainCv.height = 675;
const gctx = grainCv.getContext("2d");
const GRAIN = [...Array(6)].map((_, k) => {
  const img = gctx.createImageData(540, 675); let s = 77 + k * 211;
  for (let i = 0; i < img.data.length; i += 4) {
    s = (s * 1664525 + 1013904223) >>> 0; const v = 255 - ((s >>> 24) & 63) * (((s >>> 8) & 7) === 0 ? 1.4 : .5);
    img.data[i] = v; img.data[i + 1] = v - 2; img.data[i + 2] = v - 6; img.data[i + 3] = 255;
  } return img;
});
const hud = $("div", { cls: "layer", id: "hud" });
[[40, 40, "Top", "Left"], [1010, 40, "Top", "Right"], [40, 1280, "Bottom", "Left"], [1010, 1280, "Bottom", "Right"]].forEach(([x, y, a, b]) =>
  $("div", { cls: "cm", style: { left: x + "px", top: y + "px", ["border" + a + "Width"]: "2px", ["border" + b + "Width"]: "2px" } }, hud));
$("div", { cls: "hud-t", html: `<img src="assets/logo-icon-dark.png" alt=""><b>OTAK RENTAL</b><span>/ Konsultasi</span>`, style: { left: "92px", top: "58px" } }, hud);
$("div", { cls: "hud-t", text: "02 / 05", style: { right: "92px", top: "64px" } }, hud);
$("div", { cls: "hud-t", text: "Restart otak: DM @otakrental", style: { left: "92px", bottom: "64px", color: "#7F8277" } }, hud);
$("div", { cls: "hud-t", html: `<span class="dots"><i></i><i class="on"></i><i></i><i></i><i></i></span>`, style: { right: "92px", bottom: "64px" } }, hud);

/* ==========================================================================
   RENDER
   ========================================================================== */
const BTN = { x: 857, y: 910 };      // centre of the "Sewa otak" button on stage
function renderAt(t) {
  t = cl(t, 0, DUR);
  gctx.putImageData(GRAIN[Math.floor(t * 12) % GRAIN.length], 0, 0);
  const clickT = 3.55;

  // headline
  const ck = spring(t - .05, 1.8, 7) * (t > .05 ? 1 : 0);
  chip.style.transform = `scale(${ck})`; chip.style.transformOrigin = "0 50%";
  hl1L.forEach((e, i) => { const k = eOutExpo(P(t, .1 + i * .035, .7 + i * .035)); e.style.transform = `translateY(${(1 - k) * 110}%) rotate(${(1 - k) * 6}deg)`; });
  lagiL.forEach((e, i) => { const k = eOutExpo(P(t, .35 + i * .035, .95 + i * .035)); e.style.transform = `translateY(${(1 - k) * 110}%) rotate(${(1 - k) * 6}deg)`; });

  // "eror?" appears as a hard glitch, keeps glitching until the click, then settles
  const on = t > .62;
  eror.style.opacity = on ? 1 : 0;
  const fr = Math.floor(t * 24);
  const burst = (t < .9 ? 1 : 0) + (Math.abs(t - 1.7) < .12 ? 1 : 0) + (Math.abs(t - 2.45) < .1 ? .8 : 0) + (t > 3.2 && t < clickT ? .6 : 0);
  const calm = 1 - P(t, clickT, clickT + .5);
  const base = .25 * calm + burst;
  const jx = base * 10 * noise1(t * 30), jy = base * 3 * noise1(t * 27 + 5);
  erR.style.transform = `translate(${-7 * calm - 10 * burst * hash(fr)}px,${3 * calm}px)`;
  erC.style.transform = `translate(${7 * calm + 10 * burst * hash(fr + 7)}px,${-3 * calm}px)`;
  erR.style.opacity = erC.style.opacity = .7 * calm;
  erM.style.transform = `translate(${jx}px,${jy}px) skewX(${burst * 8 * noise1(t * 20)}deg)`;
  slices.forEach((s, i) => {
    const active = burst > 0 && hash(fr * 3 + i) > .35;
    const y0 = hash(fr * 5 + i * 11) * 80, hgt = 6 + hash(fr * 7 + i) * 22;
    s.style.clipPath = `inset(${y0}% 0 ${Math.max(0, 100 - y0 - hgt)}% 0)`;
    s.style.transform = `translateX(${(hash(fr + i * 3) - .5) * 70 * burst}px)`;
    s.style.opacity = active ? 1 : 0;
    s.style.color = i === 1 ? "#EE5A32" : "var(--emerald)";
  });

  // main dialog pops with a small shake; cascade stacks behind it
  const dk = spring(t - 1.2, 1.6, 6.5) * (t > 1.2 ? 1 : 0);
  const shake = t > 1.25 && t < 1.55 ? 8 * (1 - P(t, 1.25, 1.55)) * noise1(t * 60) : 0;
  const squash = t > clickT && t < clickT + .2 ? 1 - .03 * Math.sin(P(t, clickT, clickT + .2) * Math.PI) : 1;
  dlg.style.transform = `translate(${shake}px,0) scale(${dk * squash})`;
  dlg.style.transformOrigin = "50% 60%";
  dlg.style.opacity = t > 1.2 ? 1 : 0;
  cascade.forEach((c, i) => {
    const st = 1.95 + i * .2, k = spring(t - st, 1.8, 7) * (t > st ? 1 : 0);
    const out = eInBack(P(t, clickT + .1 + (2 - i) * .06, clickT + .4 + (2 - i) * .06), 2);
    const off = (i + 1) * 24;
    c.style.transform = `translate(${off}px,${-off}px) scale(${k * (1 - out)})`;
    c.style.transformOrigin = "50% 60%";
    c.style.opacity = t > st ? 1 - out : 0;
    c.style.zIndex = 0;
  });
  // counters tick up while the error sinks in
  const ck2 = eOutCubic(P(t, 1.45, 2.4));
  n1.textContent = Math.round(27 * ck2); n2.textContent = Math.round(3 * ck2); n3.textContent = 0;
  warnIco.style.opacity = Math.floor(t * 4) % 2 && t < clickT ? .45 : 1;

  // states: error → loading → ok
  const toLoad = eOutCubic(P(t, clickT + .12, clickT + .32)), toOk = eOutCubic(P(t, 4.75, 4.95));
  stErr.style.opacity = 1 - toLoad;
  stLoad.style.opacity = toLoad * (1 - toOk);
  stLoad.style.transform = `translateY(${(1 - toLoad) * 16}px)`;
  stOk.style.opacity = toOk;
  stOk.style.transform = `translateY(${(1 - toOk) * 16}px)`;
  const lp = eInOutCubic(P(t, clickT + .3, 4.7));
  bar.style.width = lp * 100 + "%"; pct.textContent = Math.round(lp * 100) + "%";
  tbar.style.background = t > 4.75 ? "#17463A" : "#05100E";
  tbt.textContent = t > 4.75 ? "OTAK.EXE — RUNNING" : "OTAK.EXE — SYSTEM ERROR";
  bSewa.style.transform = `scale(${t > 3.2 && t < clickT ? 1.06 : t >= clickT && t < clickT + .12 ? .94 : 1})`;
  bOk.style.transform = `scale(${1 + .04 * Math.sin(Math.max(0, t - 5) * 5) * (t > 5 ? 1 : 0)})`;

  // cursor: glides in, hovers, clicks, drifts off to rest
  const c1 = eInOutCubic(P(t, 2.7, 3.35)), c2 = eInOutCubic(P(t, 4.9, 5.6));
  let cx = lerp(1150, BTN.x + 8, c1), cy = lerp(1320, BTN.y + 4, c1);
  cx = lerp(cx, 960, c2); cy = lerp(cy, 1120, c2);
  const press = t > clickT && t < clickT + .12 ? .88 : 1;
  cursor.style.transform = `translate(${cx}px,${cy}px) scale(${press})`;
  cursor.style.opacity = t > 2.7 ? 1 - P(t, 5.5, 5.9) : 0;
  const rk = P(t, clickT + .05, clickT + .55);
  ripple.style.transform = `translate(${BTN.x}px,${BTN.y}px) scale(${1 + rk * 9})`;
  ripple.style.opacity = t > clickT + .05 ? .6 * (1 - rk) : 0;

  // resolution
  [...f1w].forEach((e, i) => { const k = eOutExpo(P(t, 5.0 + i * .07, 5.6 + i * .07)); e.style.transform = `translateY(${(1 - k) * 110}%)`; });
  [...f2a, ...f2b].forEach((e, i) => { const k = eOutExpo(P(t, 5.18 + i * .07, 5.8 + i * .07)); e.style.transform = `translateY(${(1 - k) * 110}%)`; });
  mkBar.style.transform = `scaleX(${eInOutExpo(P(t, 5.55, 5.95))})`;
}

/* ==========================================================================
   BOOT
   ========================================================================== */
window.renderAt = renderAt;
window.DURATION = DUR;
window.reelReady = (async () => {
  await document.fonts.ready;
  await document.fonts.load('800 40px "Geist"'); await document.fonts.load('40px "Geist Mono"'); await document.fonts.load('italic 40px "Instrument Serif"');
  await Promise.all([...document.images].map(i => i.decode().catch(() => {})));
  renderAt(0);
  return true;
})();
function fit() {
  const vp = document.getElementById("viewport");
  if (CAPTURE) { vp.style.transform = "none"; return; }
  const z = Math.min(innerWidth / W, innerHeight / H);
  vp.style.transform = `scale(${z})`;
  vp.style.marginRight = (W * z - W) + "px"; vp.style.marginBottom = (H * z - H) + "px";
}
addEventListener("resize", fit); fit();
if (!CAPTURE) {
  let paused = false, last = performance.now(), cur = 0;
  addEventListener("keydown", e => { if (e.code === "Space") { paused = !paused; e.preventDefault(); } });
  window.reelReady.then(() => {
    last = performance.now();
    const loop = now => { if (!paused) { cur += (now - last) / 1000; if (cur > DUR + 1) cur = 0; } last = now; renderAt(Math.min(cur, DUR)); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  });
}
</script>
</body>
</html>
